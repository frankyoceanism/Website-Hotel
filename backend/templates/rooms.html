<!DOCTYPE html>
<html>
<head>
    <title>Hotel</title>
</head>
<body>

<h1>Daftar Kamar Hotel</h1>

{% for room in rooms %}

    <h2>Kamar {{ room.nomor_kamar }}</h2>

    <p>Tipe: {{ room.tipe_kamar }}</p>
    <p>Harga: Rp{{ room.harga_per_malam }}</p>
    <p>Status: {{ room.status }}</p>

    {% if room.status == "Tersedia" %}
        <a href="/bookings/{{ room.id_room }}">
            <button>Pesan Kamar</button>
        </a>
    {% endif %}

    <hr>

{% endfor %}

</body>
</html>
