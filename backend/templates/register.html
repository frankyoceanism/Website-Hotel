{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="card narrow">
    <h1 class="center">Register</h1>

    <form method="POST" action="/register">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <label>Nama Lengkap</label>
        <input type="text" name="nama" maxlength="100" autocomplete="name" required>

        <label>Username</label>
        <input type="text" name="username"
            pattern="[A-Za-z0-9_.\-]{3,50}" minlength="3" maxlength="50"
            title="3-50 karakter: huruf, angka, titik, garis bawah, atau strip"
            autocomplete="username" required>

        <label>Password</label>
        <input type="password" name="password" minlength="6"
            title="Minimal 6 karakter" autocomplete="new-password" required>

        <button type="submit" class="btn full">Daftar</button>
    </form>

    <p class="center">
        Sudah punya akun? <a class="link" href="/login">Login</a>
    </p>
</div>
{% endblock %}
